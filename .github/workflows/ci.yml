name: CI Pipeline & Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test, Build & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type safety validation (TypeScript)
        run: npm run typecheck

      - name: Lint check (ESLint)
        run: npm run lint

      - name: Unit & Integration tests (with Package 1 Productization Guard)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Hermetic End-to-End Tests
        run: npx playwright test e2e/claimclarity.spec.ts
